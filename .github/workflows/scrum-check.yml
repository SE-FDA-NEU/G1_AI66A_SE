name: Scrum hygiene

# Teaching device, not bureaucracy: these checks make the *process* visible
# in the same place the code is. A failing check here is a conversation
# starter in the next stand-up, not a punishment.

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  linkage:
    name: PR is linked to a planned issue
    runs-on: ubuntu-latest
    steps:
      - name: Check for a closing keyword
        uses: actions/github-script@v7
        with:
          script: |
            const body  = context.payload.pull_request.body || "";
            const title = context.payload.pull_request.title || "";

            const closes = body.match(/\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#(\d+)/gi) || [];
            const titleRef = title.match(/^\[#(\d+)\]/);

            if (closes.length === 0 && !titleRef) {
              core.setFailed(
                "This pull request is not linked to an issue.\n\n" +
                "Add a line to the description: Closes #<number>\n" +
                "If no issue exists, the work was never planned. Create the issue, " +
                "put it in the current sprint, then link it."
              );
              return;
            }
            core.info(`Linked. Closing keywords found: ${closes.length}, title ref: ${!!titleRef}`);

      - name: Check the linked issue is in a sprint
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const m = [...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)];
            if (m.length === 0) return;

            for (const match of m) {
              const num = parseInt(match[1], 10);
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: num
              });
              const labels = issue.labels.map(l => (typeof l === "string" ? l : l.name));
              if (!labels.some(l => ["story", "task", "bug"].includes(l))) {
                core.warning(
                  `Issue #${num} has none of the labels story / task / bug. ` +
                  `Untyped issues do not appear in the sprint report.`
                );
              }
              if (issue.assignees.length === 0) {
                core.warning(`Issue #${num} has nobody assigned. Who is doing this work?`);
              }
            }

  no_self_merge:
    name: Someone else must review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number
            });
            const { data: requested } = await github.rest.pulls.listRequestedReviewers({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number
            });

            const others = new Set([
              ...reviews.map(r => r.user && r.user.login).filter(l => l && l !== author),
              ...requested.users.map(u => u.login).filter(l => l !== author),
            ]);

            if (others.size === 0) {
              core.warning(
                "No teammate has been asked to review this yet. " +
                "Open the Reviewers menu on the right and pick someone who did not write this code. " +
                "Cross-review counts towards your individual mark."
              );
            } else {
              core.info(`Reviewers involved: ${[...others].join(", ")}`);
            }

  size:
    name: Pull request is reviewable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const churn = pr.additions + pr.deletions;

            if (churn > 1500) {
              core.warning(
                `This PR changes ${churn} lines across ${pr.changed_files} files. ` +
                `Nobody reviews that honestly - they click Approve. ` +
                `Split it, or expect questions at the demo about who wrote what.`
              );
            }
            if (pr.commits === 1 && churn > 600) {
              core.warning(
                "One commit, hundreds of lines. This looks like work that was done " +
                "offline and pushed in a single dump. Commit as you go instead - " +
                "commit history is 25% of Milestone 3."
              );
            }
