<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products | Mini Marketplace</title>
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/products.css">
  <script src="/static/products.js" defer></script>
</head>
<body>
  <main class="catalog">
    <nav class="site-nav" aria-label="Main navigation">
      <a href="/products">Products</a>
      <a id="cart-link" href="/cart">Cart</a>
      <a id="buyer-orders-link" href="/orders">My orders</a>
      <a id="seller-new-product-link" href="/seller/products/new">Create product</a>
      <a id="seller-orders-link" href="/seller/orders">Seller orders</a>
      <a id="admin-portal-link" href="/admin" hidden>Admin portal</a>
      <a href="/notifications">Notifications</a>
      <a id="login-link" href="/login">Log in</a>
      <button id="logout-button" class="button" type="button" hidden>Log out</button>
    </nav>
    <h1 class="catalog__title">Products</h1>

    <form id="products-search" class="catalog-discovery" role="search" novalidate>
      <div class="discovery-search">
        <label for="product-search-input">Search products</label>
        <div class="catalog-search__controls">
          <input id="product-search-input" name="search" type="search"
            autocomplete="off" placeholder="Search by name or description">
          <button class="button" type="submit">Search</button>
        </div>
      </div>

      <div class="discovery-filters">
        <div class="filter-group">
          <label for="filter-category">Category</label>
          <select id="filter-category" name="category_id">
            <option value="">All categories</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filter-seller">Seller</label>
          <select id="filter-seller" name="seller_id">
            <option value="">All sellers</option>
          </select>
        </div>

        <div class="filter-group filter-group--price">
          <label for="filter-min-price">Price range (₫)</label>
          <div class="price-inputs">
            <input id="filter-min-price" name="min_price" type="number" min="0" step="1000"
              inputmode="numeric" placeholder="Min" aria-label="Minimum price (₫)" aria-describedby="price-error">
            <span class="price-separator">–</span>
            <input id="filter-max-price" name="max_price" type="number" min="0" step="1000"
              inputmode="numeric" placeholder="Max" aria-label="Maximum price (₫)" aria-describedby="price-error">
          </div>
          <span id="price-error" class="field-error" role="alert" hidden></span>
        </div>

        <div class="filter-group">
          <label for="filter-rating">Min Rating</label>
          <select id="filter-rating" name="min_rating">
            <option value="">All ratings</option>
            <option value="4.5">4.5★ and above</option>
            <option value="4.0">4.0★ and above</option>
            <option value="3.5">3.5★ and above</option>
            <option value="3.0">3.0★ and above</option>
          </select>
        </div>

        <div class="filter-group filter-group--checkbox">
          <label class="checkbox-label" for="filter-in-stock">
            <input id="filter-in-stock" name="in_stock" type="checkbox" checked>
            In stock only
          </label>
        </div>

        <div class="filter-group filter-group--sort">
          <label for="catalog-sort">Sort by</label>
          <select id="catalog-sort" name="sort">
            <option value="">Default order</option>
            <option value="newest">Newest arrivals</option>
            <option value="bestselling">Bestselling</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
            <option value="rating_desc">Highest rated</option>
          </select>
        </div>

        <div class="filter-actions">
          <button id="apply-filters" class="button" type="button">Apply</button>
          <button id="reset-filters" class="button button--secondary" type="button">Clear</button>
        </div>
      </div>
    </form>

    <p id="products-status" class="visually-hidden" role="status" aria-live="polite"></p>

    <ul id="products-loading" class="product-grid" aria-hidden="true">
      <li class="skeleton-card"></li>
      <li class="skeleton-card"></li>
      <li class="skeleton-card"></li>
      <li class="skeleton-card"></li>
      <li class="skeleton-card"></li>
      <li class="skeleton-card"></li>
      <li class="skeleton-card"></li>
      <li class="skeleton-card"></li>
    </ul>

    <ul id="products-grid" class="product-grid" hidden></ul>

    <nav id="products-pagination" class="pagination" aria-label="Product pages" hidden>
      <button id="products-previous" class="button" type="button">Previous</button>
      <span id="products-page" aria-live="polite"></span>
      <button id="products-next" class="button" type="button">Next</button>
    </nav>

    <section id="products-empty" class="state" hidden>
      <p id="products-empty-message" class="state__message">No products available at the moment.</p>
      <button id="products-reset-empty" class="button button--secondary" type="button" hidden>Reset filters</button>
    </section>

    <section id="products-error" class="state" hidden>
      <p id="products-error-message" class="state__message">We could not load the products. Check your connection, then select Retry.</p>
      <button id="products-retry" class="button" type="button">Retry</button>
    </section>
  </main>
</body>
</html>
