<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product details | Mini Marketplace</title>
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/products.css">
  <link rel="stylesheet" href="/static/reviews.css">
  <script src="/static/product-detail.js" defer></script>
</head>
<body>
  <main class="catalog">
    <nav class="site-nav" aria-label="Main navigation">
      <a href="/products">Products</a>
      <a id="cart-link" href="/cart">Cart</a>
      <a id="my-orders-link" href="/orders" hidden>My orders</a>
      <a id="seller-new-product-link" href="/seller/products/new" hidden>Create product</a>
      <a id="seller-orders-link" href="/seller/orders" hidden>Seller orders</a>
      <a href="/notifications">Notifications</a>
      <a id="login-link" href="/login">Log in</a>
      <button id="logout-button" class="button" type="button" hidden>Log out</button>
    </nav>
    <a class="back-link" href="/products">← Back to products</a>
    <p id="detail-status" class="state__message" role="status" aria-live="polite">Loading product…</p>
    <section id="product-detail" class="product-detail" hidden aria-labelledby="product-name">
      <img id="product-image" class="product-detail__image" alt="">
      <div class="product-detail__content">
        <h1 id="product-name" class="catalog__title"></h1>
        <p id="product-price" class="product-card__price"></p>
        <p id="product-rating" class="product-rating"></p>
        <p id="product-description"></p>
        <label id="variant-label" for="product-variant" hidden>Product option</label>
        <select id="product-variant" hidden></select>
        <p id="product-stock" class="product-detail__stock"></p>
        <form id="add-to-cart-form" class="cart-form">
          <label for="product-quantity">Quantity</label>
          <input id="product-quantity" type="number" min="1" value="1" required>
          <button id="add-to-cart" class="button" type="submit">Add to Cart</button>
        </form>
        <p id="cart-status" class="state__message" role="status" aria-live="polite"></p>
      </div>
    </section>
    <section id="variant-manager" class="review-form" aria-labelledby="variant-manager-heading" hidden>
      <h2 id="variant-manager-heading">Manage product options</h2>
      <p id="variant-manager-status" class="state__message" role="status" aria-live="polite"></p>
      <form id="variant-create-form">
        <label for="variant-sku">SKU</label>
        <input id="variant-sku" maxlength="64" required>
        <label for="variant-name">Option name</label>
        <input id="variant-name" maxlength="100" required>
        <label for="variant-price">Price (VND)</label>
        <input id="variant-price" type="number" min="1" step="1" required>
        <label for="variant-stock">Stock</label>
        <input id="variant-stock" type="number" min="0" step="1" required>
        <label for="variant-image">Image URL (optional)</label>
        <input id="variant-image" type="url" maxlength="2048">
        <button class="button" type="submit">Add option</button>
      </form>
      <div id="variant-manager-list"></div>
    </section>
    <section id="reviews-section" class="reviews" aria-labelledby="reviews-heading" hidden>
      <h2 id="reviews-heading">Customer reviews</h2>
      <p id="reviews-summary" role="status"></p>
      <p id="reviews-error" class="state__message" role="alert" hidden></p>
      <div id="reviews-list" class="reviews__list"></div>
    </section>
    <section id="review-form-section" class="review-form" aria-labelledby="review-form-heading" hidden>
      <h2 id="review-form-heading">Review a purchase</h2>
      <p id="review-login-prompt" hidden>
        <a id="review-login-link" href="/login">Log in as the buyer who completed this purchase to review it.</a>
      </p>
      <form id="review-form">
        <label for="review-order-item">Completed purchase</label>
        <select id="review-order-item" required></select>
        <label for="review-rating">Rating</label>
        <select id="review-rating" required>
          <option value="5">5 - Excellent</option>
          <option value="4">4 - Good</option>
          <option value="3">3 - Average</option>
          <option value="2">2 - Below average</option>
          <option value="1">1 - Poor</option>
        </select>
        <label for="review-comment">Comment (optional)</label>
        <textarea id="review-comment" maxlength="2000" rows="4"></textarea>
        <label for="review-media-url">Media URL (optional)</label>
        <input id="review-media-url" type="url" maxlength="2048" placeholder="https://…">
        <button id="review-submit" class="button" type="submit">Submit review</button>
      </form>
      <p id="review-form-status" class="state__message" role="status" aria-live="polite"></p>
    </section>
    <section id="detail-error" class="state" hidden>
      <p id="detail-error-message" class="state__message"></p>
      <a class="button button--link" href="/products">Back to catalogue</a>
      <button id="detail-retry" class="button" type="button">Retry</button>
    </section>
  </main>
</body>
</html>
