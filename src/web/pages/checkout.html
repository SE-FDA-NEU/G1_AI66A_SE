<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout</title><link rel="stylesheet" href="/static/checkout.css"><script src="/static/checkout.js" defer></script></head><body><header><a href="/products">Mini Marketplace</a> <a href="/cart">Cart</a> <a href="/notifications">Notifications</a></header><main><h1>Checkout</h1><p id="status" role="status">Loading your cart...</p><section id="summary"></section><form id="checkout-form" hidden><label>Recipient name<input name="recipient_name" required maxlength="100" autocomplete="name"></label><label>Delivery address<textarea name="delivery_address" required maxlength="1000" autocomplete="street-address"></textarea></label><label>Phone number<input name="phone_number" required minlength="7" maxlength="20" type="tel" autocomplete="tel"></label><button id="confirm">Confirm order</button></form><p id="error" role="alert"></p><button id="retry" type="button" hidden>Retry</button><p><a href="/cart">Back to cart</a> &middot; <a href="/products">Continue shopping</a></p></main></body></html>
