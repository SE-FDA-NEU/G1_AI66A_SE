<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order confirmation | Mini Marketplace</title>
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/checkout.css">
  <script src="/static/payment-display.js" defer></script>
  <script src="/static/confirmation.js" defer></script>
</head>
<body>
  <header>
    <a href="/products">Mini Marketplace</a>
    <a href="/cart">Cart</a>
    <a href="/notifications">Notifications</a>
  </header>
  <main>
    <h1>Order confirmation</h1>
    <p id="status" role="status">Loading confirmation...</p>
    <section id="payment-summary" aria-label="Payment status">
      <p id="payment-method"></p>
      <p id="payment-status"></p>
    </section>
    <section id="receipt"></section>
    <p id="error" role="alert"></p>
    <button id="retry" type="button" hidden>Retry</button>
    <p><a href="/products">Continue shopping</a></p>
  </main>
</body>
</html>
